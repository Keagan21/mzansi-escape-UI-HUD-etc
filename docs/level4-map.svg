<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Cape Town Day Zero  Level 4 map</title>
  <desc id="desc">Top-down schematic of the playable grid, water chain, gates, and landmarks.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d7a8"/>
      <stop offset="1" stop-color="#c9a06a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa7d4"/>
      <stop offset="1" stop-color="#7ee0ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6d8a"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="url(#sky)"/>
  <text x="480" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#3a2a18">Cape Town Day Zero  water chain</text>
  <text x="480" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5a4330">Sprint 1 playable: CBD, thirst, De Waal pipe puzzle. Dashed = later unlocks.</text>

  <!-- Table Mountain backdrop -->
  <polygon points="80,210 220,70 280,150 360,55 480,130 560,48 680,140 760,80 880,210" fill="#8b7355" opacity="0.95"/>
  <polygon points="80,210 880,210 880,248 80,248" fill="#6e5a42"/>
  <text x="480" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff8e8">TABLE MOUNTAIN + reservoir (fills after Node 3)</text>
  <ellipse cx="480" cy="188" rx="70" ry="18" fill="#c4b49a" stroke="#5a4a38" stroke-width="2"/>
  <text x="480" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3a2a18">dry basin</text>

  <!-- Playable board -->
  <rect x="90" y="250" width="780" height="400" rx="12" fill="#d9b07a" stroke="#8a6238" stroke-width="3"/>
  <text x="110" y="274" font-family="Segoe UI, sans-serif" font-size="12" fill="#5a4330">Playable grid (cracked earth / Bo-Kaap + CBD)</text>

  <!-- Streets hint -->
  <g stroke="#b08a58" stroke-width="10" opacity="0.45">
    <line x1="90" y1="430" x2="870" y2="430"/>
    <line x1="480" y1="250" x2="480" y2="650"/>
    <line x1="250" y1="250" x2="250" y2="650"/>
    <line x1="700" y1="250" x2="700" y2="650"/>
  </g>

  <!-- Districts -->
  <rect x="120" y="300" width="160" height="110" rx="8" fill="#f2a0b4" stroke="#8a3a55" stroke-width="2"/>
  <text x="200" y="348" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3a2a18">BO-KAAP / CBD</text>
  <text x="200" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3a2a18">Spawn · dry queues</text>
  <text x="200" y="386" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3a2a18">water bottles</text>

  <rect x="620" y="310" width="200" height="120" rx="8" fill="#5a8aa8" stroke="#1e4a62" stroke-width="2"/>
  <text x="720" y="350" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fbff">NODE 1 · DE WAAL</text>
  <text x="720" y="370" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e8f6ff">burst pipe · tile puzzle</text>
  <text x="720" y="390" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e8f6ff">flood until fixed</text>
  <text x="720" y="412" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#c8ecff">SPRINT 1 PLAYABLE</text>

  <rect x="120" y="500" width="200" height="110" rx="8" fill="#c4d4a8" stroke="#4a6230" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="220" y="540" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2a3a18">NODE 2 · NEWLANDS</text>
  <text x="220" y="560" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#2a3a18">spring · 3 valve handles</text>
  <text x="220" y="578" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#2a3a18">hoarders (later)</text>
  <text x="220" y="596" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a6230">locked until Node 1</text>

  <rect x="620" y="500" width="200" height="110" rx="8" fill="#3d4a62" stroke="#1a2230" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="540" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f0e8d8">NODE 3 · STEENBRAS</text>
  <text x="720" y="560" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#d8d0c0">load shedding timing</text>
  <text x="720" y="578" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#d8d0c0">cables + breakers</text>
  <text x="720" y="596" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#a8b0c0">locked until Node 2</text>

  <rect x="340" y="300" width="180" height="90" rx="8" fill="#7ec8d8" stroke="#1e5a6a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="338" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#123038">V&amp;A WATERFRONT</text>
  <text x="430" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#123038">win tap (after Node 3)</text>
  <text x="430" y="376" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e5a6a">not hooked in sprint 1</text>

  <!-- Gates -->
  <rect x="175" y="458" width="90" height="22" rx="4" fill="#8a3a28" stroke="#3a1210"/>
  <text x="220" y="474" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#ffe8d8">GATE A</text>
  <rect x="655" y="458" width="90" height="22" rx="4" fill="#8a3a28" stroke="#3a1210"/>
  <text x="700" y="474" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#ffe8d8">GATE B</text>

  <!-- Water chain arrows -->
  <path d="M280 355 L620 355" stroke="#2a6d8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M720 430 L720 500" stroke="#2a6d8a" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M620 555 L320 555" stroke="#2a6d8a" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M220 500 L220 430 L340 390" stroke="#2a6d8a" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M430 300 L480 248" stroke="url(#water)" stroke-width="4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <text x="450" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#1e4a62">1. restore pressure</text>
  <text x="745" y="472" font-family="Segoe UI, sans-serif" font-size="10" fill="#1e4a62">2.</text>
  <text x="470" y="542" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#1e4a62">3. pumps online</text>
  <text x="300" y="420" font-family="Segoe UI, sans-serif" font-size="10" fill="#1e4a62">4. drink at the tap</text>

  <text x="480" y="690" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#3a2a18">Hazard: thirst (bottles). Later: water hoarders at Newlands. Score: time to restore the chain.</text>
</svg>
